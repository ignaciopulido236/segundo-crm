name: Windows build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Typecheck, UI tests and frontend build
        working-directory: frontend
        run: |
          npm run check
          npm test
          npm run build
      - name: Go tests including Windows DPAPI
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Install pinned Wails v2
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
      - name: Build Windows amd64
        run: wails build -clean -platform windows/amd64 -o PrimerCRM.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PrimerCRM-windows-amd64
          path: build/bin/PrimerCRM.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PrimerCRM-windows-amd64
          path: release
      - name: Attach executable to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" release/PrimerCRM.exe --clobber
